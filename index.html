<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Game Zone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#12203A;
    --navy-light:#1C3153;
    --cream:#FFF8EA;
    --gold:#FFB84D;
    --teal:#2EC4B6;
    --pink:#FF6F91;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(46,196,182,0.18), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(255,184,77,0.15), transparent 40%),
      var(--navy);
    font-family:'Nunito',sans-serif;
    color:var(--cream);
    display:flex;flex-direction:column;align-items:center;
    padding:40px 16px 60px;
  }
  h1{font-family:'Baloo 2',sans-serif;font-size:34px;color:var(--gold);margin:0;}
  p.sub{color:#CBD5E8;margin-top:8px;}
  .grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;width:100%;max-width:820px;margin-top:34px;
  }
  .game-card{
    background:var(--navy-light);
    border-radius:18px;
    padding:22px;
    text-decoration:none;
    color:var(--cream);
    border:1px solid rgba(255,255,255,0.06);
    box-shadow:0 10px 24px rgba(0,0,0,0.3);
    transition:transform .1s ease;
  }
  .game-card:hover{transform:translateY(-3px);}
  .game-card .emoji{font-size:36px;}
  .game-card h2{font-family:'Baloo 2',sans-serif;font-size:20px;margin:10px 0 4px;color:var(--gold);}
  .game-card p{margin:0;font-size:14px;color:#CBD5E8;}
  .game-card.coming{opacity:0.45;cursor:default;}
</style>
</head>
<body>
  <h1>The Game Zone</h1>
  <p class="sub">Pick a game to play</p>
  <div class="grid">
    <a class="game-card" href="geography-quiz.html">
      <div class="emoji">🌍</div>
      <h2>Capital Quest</h2>
      <p>Guess the capital city from the country shape.</p>
    </a>
    <div class="game-card coming">
      <div class="emoji">➕</div>
      <h2>More coming soon</h2>
      <p>New games get added here.</p>
    </div>
  </div>
</body>
</html>
